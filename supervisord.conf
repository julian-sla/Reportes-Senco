[unix_http_server]
file=/var/run/supervisor.sock   ; the path to the socket file
;chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
logfile = /dev/null
loglevel = info
pidfile = /var/run/supervisord.pid
nodaemon = true
user=root

[program:php-fpm]
command = php-fpm8.2
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Laravel queue worker (database driver) - tuned for reliability in containers
[program:laravel-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --memory=512 --timeout=60 --sleep=3
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
startretries=3
startsecs=5
stopsignal=TERM
stopwaitsecs=3600
user=www-data
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Notes:
; - Tune `numprocs` to the number of worker processes you want (1 per CPU core is common).
; - `--timeout` should be slightly less than PHP-FPM / PHP max_execution_time.
; - Use `php artisan queue:restart` after deployments to reload workers gracefully.
